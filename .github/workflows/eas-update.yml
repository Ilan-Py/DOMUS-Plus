name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to publish to (matches eas.json build profile channels)'
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for EXPO_TOKEN
        # Must run after checkout: this job sets a job-wide working-directory
        # of "frontend", which doesn't exist on the runner until the repo is
        # checked out — running this step first (before checkout existed)
        # failed with "No such file or directory".
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret to run this workflow. Generate one at https://expo.dev/accounts/[account]/settings/access-tokens"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Publish update
        # No expo/expo-github-action here on purpose: its bundled eas-cli
        # installer (yarn-based) and its own post-install auth-validation
        # step both failed on current runners ("yarn failed with exit code
        # 1", then "Parameter 'commandLine' cannot be null or empty").
        # eas-cli natively authenticates from a plain EXPO_TOKEN env var in
        # CI (Expo's own documented method) — no wrapper action needed.
        # Manual dispatch lets you target preview/development too; a plain
        # push to main always goes to production (main = production-ready
        # code). The commit message is passed via env, not interpolated
        # directly into the script, so it can't be used for shell injection.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || format('Manual update by {0}', github.actor) }}
          UPDATE_CHANNEL: ${{ github.event.inputs.channel || 'production' }}
        run: eas update --channel "$UPDATE_CHANNEL" --non-interactive --message "$UPDATE_MESSAGE"
