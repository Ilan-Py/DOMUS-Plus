name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to publish to (matches eas.json build profile channels)'
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret to run this workflow. Generate one at https://expo.dev/accounts/[account]/settings/access-tokens"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        # Manual dispatch lets you target preview/development too; a plain push to
        # main always goes to production (main = production-ready code).
        # The commit message is passed via env, not interpolated directly into the
        # script, so it can't be used for shell injection (untrusted input).
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || format('Manual update by {0}', github.actor) }}
          UPDATE_CHANNEL: ${{ github.event.inputs.channel || 'production' }}
        run: eas update --channel "$UPDATE_CHANNEL" --non-interactive --message "$UPDATE_MESSAGE"
