services:
  db:
    # Postgres oficial — reemplaza MySQL (migración a Supabase/Postgres).
    # Local dev sigue usando este contenedor (offline, sin depender de red
    # ni de Supabase); Supabase se usa para staging/prod apuntando el mismo
    # backend a otro DATABASE_URL, ver backend/.env.example.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DB_NAME:-domus_db}
      # trust en vez de una password real: conveniencia de dev local,
      # nunca se usa este servicio en producción (ahí es Supabase).
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - domus_pg_data:/var/lib/postgresql/data
      # Las tablas las crea Prisma al arrancar el backend (migrate deploy en
      # backend/Dockerfile.dev). Los scripts SQL viejos quedaron en docs/scripts-viejos.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Prisma usa DATABASE_URL — el host es "db" (nombre del servicio de Postgres).
      DATABASE_URL: "postgresql://postgres@db:5432/${DB_NAME:-domus_db}"
      JWT_SECRET: ${JWT_SECRET:-domus_dev_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PORT: 3000
      # Hora de Argentina: sin esto Node corre en UTC y el seed (y cualquier fecha armada
      # con hora local, como "20:00") queda 3 horas corrido en la app.
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./backend/src:/app/src
      # Fotos de perfil (se sirven en /fotos): así aparecen al soltar un archivo, sin reconstruir
      - ./backend/public:/app/public
    depends_on:
      db:
        condition: service_healthy

volumes:
  domus_pg_data:
